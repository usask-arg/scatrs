version: 2
# One grouped pull request per ecosystem and week, for releases at least a week old (a new
# release that turns out to be broken or malicious is usually yanked within days).
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  # python-flint is pinned exactly: a new version needs the reference data regenerated.
  - package-ecosystem: uv
    directory: "/reference"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      reference:
        patterns: ["*"]
