[workspace]
members = ["scatrs"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/usask-arg/scatrs"

[workspace.dependencies]
num-complex = "0.4.6"
num-traits = "0.2.19"
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1

# Double-double reference tests are slow without optimisation; keep debug assertions on.
[profile.test]
opt-level = 2
