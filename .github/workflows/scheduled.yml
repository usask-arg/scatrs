name: Scheduled checks

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Unit tests that read reference/data skip without it (as in the published crate);
  # here a missing file is an error.
  SCATRS_REQUIRE_REFERENCE_DATA: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commit SHAs; Dependabot updates them.
jobs:
  reference-drift:
    name: Regenerate the Arb reference data and check for drift (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Regenerate every reference file
        run: uv run --locked --directory reference python -m scatrs_reference generate
      - name: Fail on any difference from the committed data
        run: |
          changes=$(git status --porcelain --untracked-files=all -- reference/data)
          if [ -n "$changes" ]; then
            echo "::error::The regenerated reference data differ from the committed files."
            echo "$changes"
            git diff --stat -- reference/data
            exit 1
          fi
      - name: Keep the regenerated data for inspection
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regenerated-reference-data-${{ matrix.os }}
          path: reference/data

  intel-macos:
    name: Rust tests (Intel macOS)
    # Not run per change, to keep its cost down; Apple's x86_64 libm is the least accurate the
    # tests have met (see LIBM_SIN_COS_U in scatrs/tests/dual_functions.rs).
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      # --nocapture logs the measured worst errors, the libm sin/cos one among them.
      - name: Run the tests
        run: cargo test --workspace --locked -- --nocapture

  ignored-tests:
    name: Slow Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash # on Windows too, so that the `--` reaches cargo unchanged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      # The #[ignore] tests: in the library, every asymptotic Gauss–Legendre rule up to 3000
      # points against double-double; in tests/gauss_legendre.rs, the double-double rule at
      # n = 20000 against Arb; in
      # tests/mie_greek_accuracy_map.rs, the phase matrix and Greek coefficients of spheres up
      # to x = 2e4. Building only those test binaries saves fat-LTO builds of the others.
      # --nocapture shows the worst errors they measure.
      - name: Run the ignored tests
        run: >-
          cargo test -p scatrs --release --locked --lib --test gauss_legendre
          --test mie_greek_accuracy_map -- --ignored --nocapture
