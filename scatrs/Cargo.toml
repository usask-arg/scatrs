[package]
name = "scatrs"
description = "Fast, linearized, rigorously validated single-scattering calculations (Mie, layered spheres, T-matrix)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["scattering", "mie", "t-matrix", "optics", "atmosphere"]
categories = ["science", "mathematics"]
# The integration tests read the Arb reference data in ../reference/data, which is outside the
# package, so they are not published. (LICENSE is a copy of the repository's, for the package.)
exclude = ["/tests/", "*.proptest-regressions"]

[dependencies]
num-complex.workspace = true
num-traits.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip makes f64 parsing correctly rounded; without it, reference values can be 1 ulp off.
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bench]]
name = "mie"
harness = false
