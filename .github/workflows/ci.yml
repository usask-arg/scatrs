name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request supersedes its running checks; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      # The whole workspace, scatrs-py included: .cargo/config.toml builds it as an extension
      # module, which needs no Python interpreter here.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build the libraries and the examples (scatrs/examples holds documented code)
        run: cargo build --workspace --lib --examples --locked
      # As `cargo publish` does at release time: package the crate, then build it from the
      # packaged files alone (the reference-backed tests are not published).
      - name: Package the scatrs crate
        run: cargo package -p scatrs --locked
      - name: Ruff (the locked version, without building scatrs)
        run: |
          uv run --locked --only-group dev ruff check .
          uv run --locked --only-group dev ruff format --check .
      - name: Lint the workflows
        run: uvx --from actionlint-py actionlint

  rust-test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # scatrs-py has no Rust tests (test = false); it is tested from Python below.
      - name: Run the tests
        run: cargo test --workspace --locked

  msrv:
    name: Rust 1.85.0 (MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.0
      # rust-toolchain.toml selects stable; `+1.85.0` overrides it.
      - name: Check the workspace
        run: cargo +1.85.0 check --workspace --all-targets --locked
      - name: Run the tests
        run: cargo +1.85.0 test --workspace --locked

  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and install scatrs with its test dependencies
        run: python -m pip install ".[test]"
      - name: Run the tests
        run: python -m pytest -q
      - name: Check the extension's type stubs
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          python -m pip install mypy
          python -m mypy.stubtest scatrs._scatrs

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      # The locked Sphinx 9; -E rereads every source, -W makes every warning an error, and the
      # examples are executed.
      - name: Build the documentation
        run: uv run --locked --extra docs sphinx-build -E -W --keep-going -b html docs docs/_build/html

  reference:
    name: Reference generator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Run the generator's tests
        run: uv run --locked --directory reference python -m pytest -q
      # About 80 s. The scheduled workflow repeats this weekly on Linux and macOS.
      - name: Regenerate every reference file
        run: uv run --locked --directory reference python -m scatrs_reference generate
      - name: Fail on any difference from the committed data
        run: |
          changes=$(git status --porcelain --untracked-files=all -- reference/data)
          if [ -n "$changes" ]; then
            echo "::error::The regenerated reference data differ from the committed files."
            echo "$changes"
            git diff --stat -- reference/data
            exit 1
          fi
